<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!-- Auth guard MUST be first — hides the page until session is verified -->
  <script src="assets/js/guard.js"></script>
  <title>Aleucia — Chronicle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="page-wrapper">

    <!-- Navigation bar -->
    <nav class="topbar" role="navigation" aria-label="Main navigation">
      <a href="home.html" class="topbar-brand">Aleucia</a>
      <div class="topbar-right">
        <span class="topbar-user" id="sessionUser"></span>
        <button class="logout-btn" onclick="logout()" type="button">Leave</button>
      </div>
    </nav>

    <!-- Page body -->
    <main class="page-content">

      <h1 class="page-title" id="pageTitle">Chronicle</h1>
      <p class="page-lead">Your story within the world of Aleucia</p>

      <div class="card-grid" id="sectionCards"></div>

    </main>

  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav-menu.js"></script>
  <script>
    (function () {
      var session = getSession();
      if (!session) return;

      var name = session.username;

      document.getElementById('sessionUser').textContent = name;
      document.getElementById('pageTitle').textContent = name;
      document.title = 'Aleucia — ' + name;

      var charData = getCharacterData(name);
      var isSpellcaster = charData && charData.spellcaster;

      // character.html resolves to this same session's own character when
      // ?character= is omitted, so these links only need ?section=.
      var sections = [
        {
          title: 'Magic Items',
          body:  'Artefacts and enchantments bound to your name.',
          href:  'character.html?section=items'
        },
        {
          title: 'Correspondence',
          body:  'Letters, notes, and rumours sent, received, or kept.',
          href:  'character.html?section=correspondence'
        },
        {
          title: 'Session Journals',
          body:  'The chronicle of your journey through Aleucia.',
          href:  'character.html?section=timeline'
        },
        {
          title: 'Quest Log',
          body:  'Active threads, completed deeds, and forgotten oaths.',
          href:  'character.html?section=quests'
        },
        {
          title: 'Relationships',
          body:  'Those whose fates have crossed and entwined with yours.',
          href:  'character.html?section=relationships'
        }
      ];

      if (isSpellcaster) {
        sections.push({
          title: 'Spell Book',
          body:  'The arcane formulae you have gathered and mastered.',
          href:  'character.html?section=spellbook'
        });
      }

      var grid = document.getElementById('sectionCards');
      sections.forEach(function (s) {
        var a = document.createElement('a');
        a.href = s.href;
        a.className = 'card';
        a.innerHTML =
          '<p class="card-title">' + s.title + '</p>' +
          '<p class="card-body">' + s.body + '</p>';
        grid.appendChild(a);
      });
    }());
  </script>

</body>
</html>
