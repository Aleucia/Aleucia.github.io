<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Aleucia — Enter the World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=2">
  <style>
    /* Login page overrides — ensure map fills the viewport */
    body { overflow: hidden; }
  </style>
</head>
<body>

  <!-- World map background -->
  <div class="map-background" aria-hidden="true"></div>

  <!-- Login panel (left side) -->
  <aside class="login-panel" role="main" aria-label="Character login">

    <h1 class="brand-title">Aleucia</h1>
    <p class="brand-subtitle">The World Awaits</p>

    <hr class="divider">

    <p class="section-label">Choose your character</p>

    <ul class="character-list" id="characterList" role="list">
      <!-- Populated by auth.js -->
    </ul>

    <div class="divider-ornament">✦</div>

    <p style="font-size:0.62rem; color:var(--text-muted); text-align:center; line-height:1.7; letter-spacing:0.05em;">
      No password needed, adventurer.<br>Simply choose who you are.
    </p>

  </aside>

  <script src="assets/js/auth.js"></script>
  <script>
    (function () {
      // If already logged in, skip straight to the destination
      const existing = getSession();
      if (existing) {
        const returnUrl = sessionStorage.getItem("aleucia_return_url") || AUTH_CONFIG.defaultRedirect;
        sessionStorage.removeItem("aleucia_return_url");
        window.location.replace(returnUrl);
        return;
      }

      // Build the character list from auth.js config
      const list = document.getElementById("characterList");

      getCharacterNames().forEach(function (name) {
        const li = document.createElement("li");
        li.className = "character-item";
        li.setAttribute("role", "listitem");

        const btn = document.createElement("button");
        btn.className = "character-btn";
        btn.type = "button";
        btn.textContent = name;

        btn.addEventListener("click", function () {
          if (!login(name)) return;
          const returnUrl = sessionStorage.getItem("aleucia_return_url") || AUTH_CONFIG.defaultRedirect;
          sessionStorage.removeItem("aleucia_return_url");
          window.location.replace(returnUrl);
        });

        li.appendChild(btn);
        list.appendChild(li);
      });
    }());
  </script>

</body>
</html>
